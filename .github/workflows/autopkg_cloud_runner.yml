name: AutoPkg Cloud Runner

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Comma-separated recipe names to run (e.g. "GoogleChrome, Firefox"). Leave empty for all.
        required: false
      run_id:
        description: AutoMunki run ID for API reporting
        required: false
      api_url:
        description: AutoMunki API URL
        required: false

jobs:
  autopkg-run:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      MUNKI_VERSION: 6.7.0
      MUNKI_EXPLICIT_VERSION: 6.7.0.4731
      AUTOPKG_VERSION: 2.7.6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.create_token.outputs.token }}
          fetch-depth: 0

      - name: Setup metadata cache
        uses: actions/cache@v5
        with:
          path: metadata_cache.json
          key: autopkg-cache-${{ github.run_id }}
          restore-keys: autopkg-cache-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install AutoPkg
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/autopkg/autopkg/releases/download/v${{ env.AUTOPKG_VERSION }}/autopkg-${{ env.AUTOPKG_VERSION }}.pkg

      - name: Install Munki
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/munki/munki/releases/download/v${{ env.MUNKI_VERSION }}/munkitools-${{ env.MUNKI_EXPLICIT_VERSION }}.pkg

      - name: Configure AutoPkg
        run: |
          defaults write com.github.autopkg CACHE_DIR "${GITHUB_WORKSPACE}/AutoPkg/Cache"
          defaults write com.github.autopkg RECIPE_OVERRIDE_DIRS "${GITHUB_WORKSPACE}/autopkg_src/overrides/"
          defaults write com.github.autopkg RECIPE_REPO_DIR "${GITHUB_WORKSPACE}/autopkg_src/repos/"
          defaults write com.github.autopkg FAIL_RECIPES_WITHOUT_TRUST_INFO -bool TRUE
          defaults write com.github.autopkg MUNKI_REPO "${GITHUB_WORKSPACE}"
          defaults write com.github.autopkg GITHUB_TOKEN "${{ steps.create_token.outputs.token }}"
          mkdir -p ./pkgs/
          mkdir -p /Users/runner/Library/AutoPkg/
          ln -sf "${GITHUB_WORKSPACE}/autopkg_src/Recipes" /Users/runner/Library/AutoPkg/

      - name: Add AutoPkg repos
        run: |
          cat ./autopkg_src/repo_list.txt | xargs -L1 autopkg repo-add

      - name: Generate recipe list
        id: recipe_list
        run: |
          RECIPE_INPUT="${{ github.event.inputs.recipe }}"
          if [ -n "$RECIPE_INPUT" ]; then
            python3 -c "
          import json, sys
          raw = sys.argv[1]
          names = [n.strip() for n in raw.split(',') if n.strip()]
          recipes = [n if n.endswith('.recipe') else n + '.munki.recipe' for n in names]
          with open('run_recipe_list.json', 'w') as f:
              json.dump(recipes, f)
          print(f'Generated recipe list with {len(recipes)} recipes: {recipes}')
          " "$RECIPE_INPUT"
            echo "path=run_recipe_list.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=autopkg_src/recipe_list.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cloud-autopkg-runner
        run: |
          uvx 'cloud-autopkg-runner[json]' -v \
            --recipe-list "${{ steps.recipe_list.outputs.path }}" \
            --cache-file metadata_cache.json \
            --cache-plugin json \
            --log-file autopkg_runner.log \
            --report-dir AutoPkg/Reports/

      - name: Report results to API
        if: always() && github.event.inputs.run_id != '' && github.event.inputs.api_url != ''
        env:
          API_URL: ${{ github.event.inputs.api_url }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          REPORT_DIR="AutoPkg/Reports"
          API_BASE="${API_URL}/api/v1/autopkg"

          if [ ! -d "$REPORT_DIR" ] || [ -z "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
            echo "No report files found, marking run complete"
            curl -sf -X POST "${API_BASE}/runs/${RUN_ID}/complete" \
              -H "Content-Type: application/json" -d '{}'
            exit 0
          fi

          for report in "$REPORT_DIR"/*.plist; do
            [ -f "$report" ] || continue
            echo "Processing report: $report"

            REPORT_FILE="$report" python3 << 'PYEOF'
          import json
          import os
          import plistlib
          import urllib.request

          api_base = os.environ["API_BASE"]
          run_id = os.environ["RUN_ID"]
          report_path = os.environ.get("REPORT_FILE", "")

          if not report_path or not os.path.exists(report_path):
              print(f"Report not found: {report_path}")
              raise SystemExit(0)

          with open(report_path, "rb") as f:
              report = plistlib.load(f)

          failures = report.get("failures", [])
          summary = report.get("summary_results", {})
          munki_summary = summary.get("munki_importer_summary_result", {})
          imported_items = munki_summary.get("data_rows", [])

          recipe_name = os.path.basename(report_path).replace(".plist", "")
          identifier = f"local.munki.{recipe_name}"

          if imported_items:
              for item in imported_items:
                  catalogs = item.get("catalogs", "")
                  if isinstance(catalogs, str):
                      catalogs = [c.strip() for c in catalogs.split(",") if c.strip()]
                  payload = {
                      "recipe_identifier": identifier,
                      "recipe_name": recipe_name,
                      "status": "imported",
                      "imported_version": item.get("version"),
                      "imported_pkg_path": item.get("pkg_repo_path"),
                      "imported_pkginfo_path": item.get("pkginfo_path"),
                      "imported_catalogs": catalogs,
                  }
                  data = json.dumps(payload).encode()
                  req = urllib.request.Request(
                      f"{api_base}/runs/{run_id}/results",
                      data=data,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          print(f"Reported imported: {recipe_name} ({resp.status})")
                  except Exception as e:
                      print(f"Failed to report {recipe_name}: {e}")

          elif failures:
              error_msg = "; ".join(f.get("message", "") for f in failures if isinstance(f, dict))
              payload = {
                  "recipe_identifier": identifier,
                  "recipe_name": recipe_name,
                  "status": "failed",
                  "error_message": error_msg,
              }
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api_base}/runs/{run_id}/results",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Reported failed: {recipe_name} ({resp.status})")
              except Exception as e:
                  print(f"Failed to report {recipe_name}: {e}")

          else:
              payload = {
                  "recipe_identifier": identifier,
                  "recipe_name": recipe_name,
                  "status": "no_change",
              }
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api_base}/runs/{run_id}/results",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Reported no_change: {recipe_name} ({resp.status})")
              except Exception as e:
                  print(f"Failed to report {recipe_name}: {e}")
          PYEOF
          done

          echo "Marking run complete"
          curl -sf -X POST "${API_BASE}/runs/${RUN_ID}/complete" \
            -H "Content-Type: application/json" -d '{}'

      # - name: Configure AWS credentials
      #   if: always()
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1

      # - name: Push packages to Storage Bucket
      #   if: always()
      #   run: |
      #     aws s3 sync ./pkgs/ s3://${{ secrets.AWS_S3_BUCKET }}/pkgs/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopkg-run-artifacts
          path: |
            AutoPkg/Cache/**/*receipt*
            AutoPkg/Reports/*
            autopkg_runner.log
            metadata_cache.json
