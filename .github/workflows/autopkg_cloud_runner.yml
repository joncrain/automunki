name: AutoPkg Cloud Runner

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Comma-separated recipe names to run (e.g. "GoogleChrome, Firefox"). Leave empty for all.
        required: false
      run_id:
        description: AutoMunki run ID for API reporting
        required: false
      api_url:
        description: AutoMunki API URL
        required: false

env:
  BACKEND_URL: "https://cc00-107-181-205-9.ngrok-free.app"

jobs:
  autopkg-run:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MUNKI_VERSION: 7.0.10
      MUNKI_EXPLICIT_VERSION: 7.0.10.5496
      AUTOPKG_VERSION: 2.9.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install AutoPkg
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/autopkg/autopkg/releases/download/v${{ env.AUTOPKG_VERSION }}/autopkg-${{ env.AUTOPKG_VERSION }}.pkg

      - name: Install Munki
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/munki/munki/releases/download/v${{ env.MUNKI_VERSION }}/munkitools-${{ env.MUNKI_EXPLICIT_VERSION }}.pkg

      - name: Configure AutoPkg
        run: |
          defaults write com.github.autopkg CACHE_DIR "${GITHUB_WORKSPACE}/AutoPkg/Cache"
          defaults write com.github.autopkg RECIPE_OVERRIDE_DIRS "${GITHUB_WORKSPACE}/AutoPkg/Overrides/"
          defaults write com.github.autopkg RECIPE_REPO_DIR "${GITHUB_WORKSPACE}/AutoPkg/repos/"
          defaults write com.github.autopkg FAIL_RECIPES_WITHOUT_TRUST_INFO -bool TRUE
          defaults write com.github.autopkg MUNKI_REPO "${GITHUB_WORKSPACE}"
          defaults write com.github.autopkg GITHUB_TOKEN "${{ secrets.GITHUB_TOKEN }}"
          mkdir -p ./pkgs/
          mkdir -p /Users/runner/Library/AutoPkg/

      - name: Load metadata cache from API
        run: |
          API_BASE="${BACKEND_URL}/api/v1/autopkg"
          echo "Fetching metadata cache from ${API_BASE}/metadata-cache"
          HTTP_CODE=$(curl -s -o metadata_cache_response.json -w "%{http_code}" "${API_BASE}/metadata-cache")
          if [ "$HTTP_CODE" = "200" ]; then
            python3 AutoPkg/scripts/load_metadata_cache.py
          else
            echo "No metadata cache found (HTTP ${HTTP_CODE}), starting fresh"
            echo '{}' > metadata_cache.json
          fi

      - name: Fetch run config from API
        id: run_config
        if: github.event.inputs.api_url != ''
        env:
          RECIPE_INPUT: ${{ github.event.inputs.recipe }}
        run: |
          API_BASE="${BACKEND_URL}/api/v1/autopkg"
          QUERY_PARAMS=""
          if [ -n "$RECIPE_INPUT" ]; then
            QUERY_PARAMS="?recipes=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$RECIPE_INPUT'))")"
          fi

          echo "Fetching run config from ${API_BASE}/runs/config${QUERY_PARAMS}"
          curl -sf "${API_BASE}/runs/config${QUERY_PARAMS}" -o run_config.json

          echo "Run config:"
          cat run_config.json | python3 -m json.tool

          echo "has_config=true" >> "$GITHUB_OUTPUT"

      - name: Write override files and repo list from API config
        if: steps.run_config.outputs.has_config == 'true'
        run: python3 AutoPkg/scripts/write_overrides.py

      - name: Add AutoPkg repos
        run: |
          REPO_FILE="AutoPkg/run_repo_list.txt"
          cat "$REPO_FILE" | xargs -L1 autopkg repo-add

      - name: Update AutoPkg repos
        run: autopkg repo-update all

      - name: Sync AutoPkg preferences to disk
        run: |
          defaults read com.github.autopkg > /dev/null 2>&1
          echo "RECIPE_OVERRIDE_DIRS:"
          defaults read com.github.autopkg RECIPE_OVERRIDE_DIRS 2>/dev/null || echo "(not set)"
          echo "RECIPE_SEARCH_DIRS:"
          defaults read com.github.autopkg RECIPE_SEARCH_DIRS 2>/dev/null || echo "(not set)"
          echo "RECIPE_REPO_DIR:"
          defaults read com.github.autopkg RECIPE_REPO_DIR 2>/dev/null || echo "(not set)"

      - name: Run cloud-autopkg-runner
        run: |
          uvx 'cloud-autopkg-runner' -v \
            --recipe-list AutoPkg/run_recipe_list.json \
            --cache-file metadata_cache.json \
            --cache-plugin json \
            --log-file autopkg_runner.log \
            --report-dir AutoPkg/Reports/

      - name: Save metadata cache to API
        if: always()
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
        run: |
          if [ ! -f metadata_cache.json ]; then
            echo "No metadata cache file found, skipping"
            exit 0
          fi
          python3 AutoPkg/scripts/save_metadata_cache.py

      - name: Report results and ingest pkginfo
        if: always() && github.event.inputs.run_id != '' && github.event.inputs.api_url != ''
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          REPORT_DIR="AutoPkg/Reports"
          PKGSINFO_DIR="${GITHUB_WORKSPACE}/pkgsinfo"

          if [ ! -d "$REPORT_DIR" ] || [ -z "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
            echo "No report files found, marking run complete"
            curl -sf -X POST "${API_BASE_URL}/api/v1/autopkg/runs/${RUN_ID}/complete" \
              -H "Content-Type: application/json" -d '{}'
            exit 0
          fi

          for report in "$REPORT_DIR"/*.plist; do
            [ -f "$report" ] || continue
            echo "Processing report: $report"
            REPORT_FILE="$report" PKGSINFO_DIR="$PKGSINFO_DIR" python3 AutoPkg/scripts/report_results.py
          done

          echo "Marking run complete"
          curl -sf -X POST "${API_BASE_URL}/api/v1/autopkg/runs/${RUN_ID}/complete" \
            -H "Content-Type: application/json" -d '{}'

      # - name: Configure AWS credentials
      #   if: always()
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1

      # - name: Push packages to Storage Bucket
      #   if: always()
      #   run: |
      #     aws s3 sync ./pkgs/ s3://${{ secrets.AWS_S3_BUCKET }}/pkgs/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autopkg-run-artifacts
          path: |
            AutoPkg/Cache/**/*receipt*
            AutoPkg/Reports/*
            autopkg_runner.log
            metadata_cache.json
