name: AutoPkg Cloud Runner

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Comma-separated recipe names to run (e.g. "GoogleChrome, Firefox"). Leave empty for all.
        required: false
      run_id:
        description: AutoMunki run ID for API reporting
        required: false
      api_url:
        description: AutoMunki API URL
        required: false

env:
  BACKEND_URL: "https://f95c-107-181-205-9.ngrok-free.app"

jobs:
  autopkg-run:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MUNKI_VERSION: 6.7.0
      MUNKI_EXPLICIT_VERSION: 6.7.0.4731
      AUTOPKG_VERSION: 2.7.6
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup metadata cache
        uses: actions/cache@v5
        with:
          path: metadata_cache.json
          key: autopkg-cache-${{ github.run_id }}
          restore-keys: autopkg-cache-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install AutoPkg
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/autopkg/autopkg/releases/download/v${{ env.AUTOPKG_VERSION }}/autopkg-${{ env.AUTOPKG_VERSION }}.pkg

      - name: Install Munki
        uses: joncrain/macos-pkg-install@v1.0
        with:
          pkg_url: https://github.com/munki/munki/releases/download/v${{ env.MUNKI_VERSION }}/munkitools-${{ env.MUNKI_EXPLICIT_VERSION }}.pkg

      - name: Configure AutoPkg
        run: |
          defaults write com.github.autopkg CACHE_DIR "${GITHUB_WORKSPACE}/AutoPkg/Cache"
          defaults write com.github.autopkg RECIPE_OVERRIDE_DIRS "${GITHUB_WORKSPACE}/AutoPkg/overrides/"
          defaults write com.github.autopkg RECIPE_REPO_DIR "${GITHUB_WORKSPACE}/AutoPkg/repos/"
          defaults write com.github.autopkg FAIL_RECIPES_WITHOUT_TRUST_INFO -bool TRUE
          defaults write com.github.autopkg MUNKI_REPO "${GITHUB_WORKSPACE}"
          defaults write com.github.autopkg GITHUB_TOKEN "${{ secrets.GITHUB_TOKEN }}"
          mkdir -p ./pkgs/
          mkdir -p /Users/runner/Library/AutoPkg/

      - name: Fetch run config from API
        id: run_config
        if: github.event.inputs.api_url != ''
        env:
          API_URL: ${{ github.event.inputs.api_url }}
          RECIPE_INPUT: ${{ github.event.inputs.recipe }}
        run: |
          API_BASE="${BACKEND_URL}/api/v1/autopkg"
          QUERY_PARAMS=""
          if [ -n "$RECIPE_INPUT" ]; then
            QUERY_PARAMS="?recipes=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$RECIPE_INPUT'))")"
          fi

          echo "Fetching run config from ${API_BASE}/runs/config${QUERY_PARAMS}"
          curl -sf "${API_BASE}/runs/config${QUERY_PARAMS}" -o run_config.json

          echo "Run config:"
          cat run_config.json | python3 -m json.tool

          echo "has_config=true" >> "$GITHUB_OUTPUT"

      - name: Write override files and repo list from API config
        if: steps.run_config.outputs.has_config == 'true'
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import plistlib

          with open("run_config.json") as f:
              config = json.load(f)

          override_dir = os.path.join(os.environ["GITHUB_WORKSPACE"], "AutoPkg", "Overrides")
          os.makedirs(override_dir, exist_ok=True)

          recipe_names = []
          for override in config.get("overrides", []):
              name = override["name"]
              plist_data = override.get("plist", {})
              filename = f"{name}.munki.recipe"
              filepath = os.path.join(override_dir, filename)

              with open(filepath, "wb") as f:
                  plistlib.dump(plist_data, f)
              print(f"Wrote override: {filepath}")
              recipe_names.append(filename)

          with open("AutoPkg/run_recipe_list.json", "w") as f:
              json.dump(recipe_names, f)
          print(f"Recipe list: {recipe_names}")

          repos = config.get("repos", [])
          with open("AutoPkg/run_repo_list.txt", "w") as f:
              for repo in repos:
                  f.write(repo + "\n")
          print(f"Repo list ({len(repos)} repos): {repos}")
          PYEOF

      - name: Add AutoPkg repos
        run: |
          REPO_FILE="AutoPkg/run_repo_list.txt"
          cat "$REPO_FILE" | xargs -L1 autopkg repo-add

      - name: Run cloud-autopkg-runner
        run: |
          uvx 'cloud-autopkg-runner' -v \
            --recipe-list AutoPkg/run_recipe_list.json \
            --cache-file metadata_cache.json \
            --cache-plugin json \
            --log-file autopkg_runner.log \
            --report-dir AutoPkg/Reports/

      - name: Report results to API
        if: always() && github.event.inputs.run_id != '' && github.event.inputs.api_url != ''
        env:
          API_URL: ${{ github.event.inputs.api_url }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          REPORT_DIR="AutoPkg/Reports"
          API_BASE="${BACKEND_URL}/api/v1/autopkg"

          if [ ! -d "$REPORT_DIR" ] || [ -z "$(ls -A "$REPORT_DIR" 2>/dev/null)" ]; then
            echo "No report files found, marking run complete"
            curl -sf -X POST "${API_BASE}/runs/${RUN_ID}/complete" \
              -H "Content-Type: application/json" -d '{}'
            exit 0
          fi

          for report in "$REPORT_DIR"/*.plist; do
            [ -f "$report" ] || continue
            echo "Processing report: $report"

            REPORT_FILE="$report" python3 << 'PYEOF'
          import json
          import os
          import plistlib
          import urllib.request

          api_base = os.environ["API_BASE"]
          run_id = os.environ["RUN_ID"]
          report_path = os.environ.get("REPORT_FILE", "")

          if not report_path or not os.path.exists(report_path):
              print(f"Report not found: {report_path}")
              raise SystemExit(0)

          with open(report_path, "rb") as f:
              report = plistlib.load(f)

          failures = report.get("failures", [])
          summary = report.get("summary_results", {})
          munki_summary = summary.get("munki_importer_summary_result", {})
          imported_items = munki_summary.get("data_rows", [])

          recipe_name = os.path.basename(report_path).replace(".plist", "")
          identifier = f"local.munki.{recipe_name}"

          def post_result(payload):
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{api_base}/runs/{run_id}/results",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(f"Reported {payload['status']}: {recipe_name} ({resp.status})")
              except Exception as e:
                  print(f"Failed to report {recipe_name}: {e}")

          if imported_items:
              for item in imported_items:
                  catalogs = item.get("catalogs", "")
                  if isinstance(catalogs, str):
                      catalogs = [c.strip() for c in catalogs.split(",") if c.strip()]
                  post_result({
                      "recipe_identifier": identifier,
                      "recipe_name": recipe_name,
                      "status": "imported",
                      "imported_version": item.get("version"),
                      "imported_pkg_path": item.get("pkg_repo_path"),
                      "imported_pkginfo_path": item.get("pkginfo_path"),
                      "imported_catalogs": catalogs,
                  })
          elif failures:
              error_msg = "; ".join(
                  f.get("message", "") for f in failures if isinstance(f, dict)
              )
              post_result({
                  "recipe_identifier": identifier,
                  "recipe_name": recipe_name,
                  "status": "failed",
                  "error_message": error_msg,
              })
          else:
              post_result({
                  "recipe_identifier": identifier,
                  "recipe_name": recipe_name,
                  "status": "no_change",
              })
          PYEOF
          done

          echo "Marking run complete"
          curl -sf -X POST "${API_BASE}/runs/${RUN_ID}/complete" \
            -H "Content-Type: application/json" -d '{}'

      # - name: Configure AWS credentials
      #   if: always()
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1

      # - name: Push packages to Storage Bucket
      #   if: always()
      #   run: |
      #     aws s3 sync ./pkgs/ s3://${{ secrets.AWS_S3_BUCKET }}/pkgs/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopkg-run-artifacts
          path: |
            AutoPkg/Cache/**/*receipt*
            AutoPkg/Reports/*
            autopkg_runner.log
            metadata_cache.json
